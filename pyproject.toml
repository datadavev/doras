[project]
name = "doras"
version = "0.1.0"
description = "Data in ORAS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.1",
    "httpx>=0.28.1",
    "jupyterlab>=4.5.9",
    "oras>=0.2.42",
    "ratarmount[full]>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
doras = "doras.__main__:main"
